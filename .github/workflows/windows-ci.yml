name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python for document worker tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create artifact folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/logs, artifacts/test-results | Out-Null

      - name: Install npm dependencies
        shell: pwsh
        run: |
          npm ci 2>&1 | Tee-Object artifacts/logs/npm-ci.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and verify the locked Electron runtime
        shell: pwsh
        run: |
          npm run ensure:electron-runtime 2>&1 | Tee-Object artifacts/logs/electron-runtime.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          npx playwright install chromium 2>&1 | Tee-Object artifacts/logs/playwright-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install NSIS for installer integration tests
        shell: pwsh
        run: |
          $knownNsisPaths = @('C:\Program Files (x86)\NSIS', 'C:\Program Files\NSIS')
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $makensis) {
            foreach ($candidate in $knownNsisPaths) {
              $exe = Join-Path $candidate 'makensis.exe'
              if (Test-Path -LiteralPath $exe) { $makensis = Get-Item -LiteralPath $exe; break }
            }
          }
          if (-not $makensis) {
            $installExit = 1
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Host "Installing NSIS with Chocolatey (attempt $attempt of 3)."
              choco install nsis --yes --no-progress --limit-output 2>&1 | Tee-Object -FilePath artifacts/logs/nsis-install-attempt-$attempt.log
              $installExit = $LASTEXITCODE
              if ($installExit -eq 0) { break }
              foreach ($candidate in $knownNsisPaths) {
                $exe = Join-Path $candidate 'makensis.exe'
                if (Test-Path -LiteralPath $exe) { $makensis = Get-Item -LiteralPath $exe; break }
              }
              if ($makensis) { break }
              if ($attempt -lt 3) {
                $delay = [Math]::Min(120, 15 * [Math]::Pow(2, $attempt - 1))
                Write-Warning "NSIS feed/install failed (exit $installExit). Retrying in $delay seconds."
                Start-Sleep -Seconds $delay
              }
            }
            if (-not $makensis) {
              $fallbackVersion = '3.11'
              $fallbackUrl = 'https://sourceforge.net/projects/nsis/files/NSIS%203/3.11/nsis-3.11-setup.exe/download'
              $fallbackPath = Join-Path $env:RUNNER_TEMP 'nsis-3.11-setup.exe'
              $expectedHash = '38d49f8fe09b1c332b01d0940e57b7258f4447733643273a01c59959ad9d3b0a'
              Write-Warning "Chocolatey provisioning failed; using the official NSIS $fallbackVersion SourceForge release with pinned SHA-256 verification."
              try {
                Invoke-WebRequest -Uri $fallbackUrl -OutFile $fallbackPath -MaximumRedirection 10
                $actualHash = (Get-FileHash -LiteralPath $fallbackPath -Algorithm SHA256).Hash.ToLowerInvariant()
                if ($actualHash -ne $expectedHash) { throw "Official NSIS $fallbackVersion checksum mismatch: $actualHash" }
                $installer = Start-Process -FilePath $fallbackPath -ArgumentList '/S' -Wait -PassThru
                if ($installer.ExitCode -ne 0) { throw "Official NSIS installer exited with code $($installer.ExitCode)." }
                foreach ($candidate in $knownNsisPaths) {
                  $exe = Join-Path $candidate 'makensis.exe'
                  if (Test-Path -LiteralPath $exe) { $makensis = Get-Item -LiteralPath $exe; break }
                }
              } catch {
                $_ | Out-String | Tee-Object -FilePath artifacts/logs/nsis-install-fallback.log | Write-Host
                throw "Chocolatey NSIS provisioning and the checksum-verified official fallback both failed. See artifacts/logs/nsis-install-attempt-*.log and nsis-install-fallback.log."
              }
            }
            if (-not $makensis) {
              throw "NSIS installation returned without a usable makensis.exe after bounded retries (last Chocolatey exit $installExit). See artifacts/logs/nsis-install-attempt-*.log."
            }
          }
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if ($makensis) { $nsisExe = $makensis.Source }
          else {
            $nsisExe = $null
            foreach ($candidate in $knownNsisPaths) {
              $exe = Join-Path $candidate 'makensis.exe'
              if (Test-Path -LiteralPath $exe) { $nsisExe = $exe; break }
            }
          }
          if (-not $nsisExe) { throw 'NSIS installation returned success but makensis.exe is not present in PATH or a standard install directory.' }
          $nsisPath = Split-Path -Parent $nsisExe
          Add-Content -Path $env:GITHUB_PATH -Value $nsisPath
          $env:PATH = "$env:PATH;$nsisPath"
          & $nsisExe /VERSION 2>&1 | Tee-Object artifacts/logs/nsis-version.log
          if ($LASTEXITCODE -ne 0) { throw "makensis version check failed with exit code $LASTEXITCODE." }

      - name: Type check
        shell: pwsh
        run: |
          npm run typecheck 2>&1 | Tee-Object artifacts/logs/typecheck.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test local voice worker safety and recovery
        shell: pwsh
        run: |
          python -m unittest discover -s python/tests -v 2>&1 | Tee-Object artifacts/logs/voice-worker-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise the sandboxed preload bridge
        shell: pwsh
        run: |
          npm run test:preload-sandbox 2>&1 | Tee-Object artifacts/logs/preload-sandbox.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full automated test suite
        shell: pwsh
        run: |
          $env:PIXEL_PYTHON = (Get-Command python).Source
          Write-Host "Document tests use Python at $env:PIXEL_PYTHON"
          npm test -- --reporter=default --reporter=junit --outputFile.junit=artifacts/test-results/vitest-junit.xml 2>&1 | Tee-Object artifacts/logs/tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile native UI Automation helper
        shell: pwsh
        run: |
          npm run build:native 2>&1 | Tee-Object artifacts/logs/native-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build unpacked app, portable executable and NSIS installer
        shell: pwsh
        run: |
          $env:PIXEL_VOICE_BUILD_PYTHON = Join-Path $env:pythonLocation 'python.exe'
          Write-Host "Voice worker build interpreter: $env:PIXEL_VOICE_BUILD_PYTHON"
          npm run dist 2>&1 | Tee-Object artifacts/logs/package.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload logs, test report and Windows distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-windows-ci-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/logs/**/*.log
            artifacts/logs/*.log
            artifacts/test-results/*.xml
            artifacts/windows-acceptance/*.json
            artifacts/windows-acceptance/*.log
            dist/main/preload/index.js
            release/**
            native/bin/PixelNative.exe
